<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Laporan Guru Piket</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <style>
        /* Sembunyikan elemen scrollbar agar lebih rapi namun tetap bisa di-scroll */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* CSS KHUSUS UNTUK CETAK PDF */
        @media print {
            /* Sembunyikan semua elemen default */
            body * { visibility: hidden; }
            /* Tampilkan hanya area cetak */
            #print-section, #print-section * { visibility: visible; }
            #print-section { 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 100%; 
                background: white !important;
                margin: 0; 
                padding: 10px;
            }
            /* Hilangkan warna background bawaan browser jika ada */
            body { background-color: white !important; }
            /* PERBAIKAN: Ubah parent agar halaman bisa dicetak penuh (tidak blank) */
            #piket-app {
                position: static !important;
                overflow: visible !important;
                height: auto !important;
            }
            @page { size: A4 portrait; margin: 1cm; }
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- WRAPPER UTAMA: Menutupi seluruh template Blogger -->
    <div id="piket-app" class="fixed inset-0 w-full h-full bg-gray-50 z-[999999] overflow-y-auto font-sans" x-data="piketApp()">
        
        <!-- THUMBNAIL BLOGGER (Tersembunyi) -->
        <div style="display:none;">
            <img src="https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&q=80&w=800" alt="Laporan Piket Thumbnail">
        </div>

        <!-- NOTIFIKASI TOAST -->
        <div x-show="toast.show" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 transform translate-y-[-20px]"
             x-transition:enter-end="opacity-100 transform translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[1000000] px-6 py-3 rounded-lg shadow-lg text-white font-medium"
             :class="toast.type === 'error' ? 'bg-red-600' : (toast.type === 'success' ? 'bg-green-600' : 'bg-blue-600')"
             style="display: none;">
            <span x-text="toast.message"></span>
        </div>

        <!-- OVERLAY LOADING -->
        <div x-show="isLoading" class="fixed inset-0 bg-black bg-opacity-50 z-[1000000] flex flex-col items-center justify-center text-white" style="display: none;">
            <i class="fas fa-spinner fa-spin text-5xl mb-4"></i>
            <p class="text-lg font-semibold animate-pulse">Memproses Data...</p>
        </div>

        <!-- ================= HALAMAN LOGIN ================= -->
        <template x-if="page === 'login'">
            <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-500 to-indigo-600">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
                    <div class="text-center mb-8">
                        <div class="w-24 h-24 mx-auto mb-4">
                            <img src="https://iili.io/CU2uox4.png" alt="Logo Sekolah" class="w-full h-full object-contain">
                        </div>
                        <h1 class="text-2xl font-bold text-gray-800">Laporan Guru Piket</h1>
                        <p class="text-gray-500 mt-2 text-sm">ayo bersemangat</p>
                        
                        <template x-if="IS_PREVIEW">
                            <div class="mt-4 p-3 bg-yellow-100 text-yellow-800 text-xs rounded border border-yellow-300 text-left">
                                <strong>MODE PREVIEW AKTIF!</strong><br>
                                Admin: admin / edudigital<br>
                                Guru: peserta / edudigital
                            </div>
                        </template>
                    </div>

                    <form @submit.prevent="doLogin" class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Username / NIP</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-user"></i></span>
                                <input type="text" x-model="loginData.username" required class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Masukkan Username">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-lock"></i></span>
                                <input type="password" x-model="loginData.password" required class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Masukkan Password">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                            Masuk <i class="fas fa-sign-in-alt ml-2"></i>
                        </button>
                    </form>
                </div>
            </div>
        </template>

        <!-- MAIN LAYOUT (Untuk Guru & Admin) -->
        <template x-if="page !== 'login'">
            <div class="min-h-screen flex flex-col">
                <!-- NAVBAR -->
                <nav class="bg-blue-600 text-white shadow-lg sticky top-0 z-[990]">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between h-16">
                            <div class="flex items-center">
                                <i class="fas fa-clipboard-list text-2xl mr-3"></i>
                                <span class="font-bold text-lg tracking-wide hidden sm:block">E-Piket Sekolah</span>
                            </div>
                            <div class="flex items-center space-x-4">
                                <div class="text-right hidden sm:block">
                                    <div class="text-sm font-bold" x-text="user?.nama"></div>
                                    <div class="text-xs text-blue-200 capitalize" x-text="user?.role"></div>
                                </div>
                                <button @click="doLogout" class="bg-blue-700 hover:bg-blue-800 p-2 rounded-lg transition" title="Logout">
                                    <i class="fas fa-sign-out-alt"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </nav>

                <!-- KONTEN GURU PIKET -->
                <template x-if="user && user.role === 'guru'">
                    <div class="flex-grow max-w-4xl mx-auto w-full p-4 space-y-6">
                        
                        <!-- Header & Tanggal -->
                        <div class="bg-white rounded-xl shadow p-6 border-t-4 border-blue-500">
                            <h2 class="text-xl font-bold text-gray-800">Formulir Laporan Piket Harian</h2>
                            <p class="text-gray-500 text-sm mt-1">Isi laporan dengan lengkap. Absensi kelas wajib diisi untuk rekapitulasi.</p>
                        </div>

                        <!-- Tabs Guru -->
                        <div class="flex space-x-2 bg-white rounded-lg p-1 shadow flex-wrap gap-y-2">
                            <button @click="guruTab = 'form'" :class="guruTab === 'form' ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-100'" class="flex-1 py-2 px-4 rounded-md font-medium text-sm transition whitespace-nowrap">
                                <i class="fas fa-pen-to-square mr-2"></i> Isi Laporan
                            </button>
                            <button @click="loadGuruHistory()" :class="guruTab === 'riwayat' ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-100'" class="flex-1 py-2 px-4 rounded-md font-medium text-sm transition whitespace-nowrap">
                                <i class="fas fa-history mr-2"></i> Riwayat Saya
                            </button>
                            <button @click="loadSiswaData()" :class="guruTab === 'siswa' ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-100'" class="flex-1 py-2 px-4 rounded-md font-medium text-sm transition whitespace-nowrap">
                                <i class="fas fa-users-line mr-2"></i> Format Absen
                            </button>
                        </div>

                        <!-- Form Area -->
                        <div x-show="guruTab === 'form'" class="bg-white rounded-xl shadow overflow-hidden">
                            <form @submit.prevent="submitLaporan" class="p-6 space-y-6">
                                
                                <!-- Waktu & Guru Absen -->
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Jam Kedatangan Piket</label>
                                        <input type="time" x-model="form.jamHadir" required class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Guru Yang Tidak Hadir (Kosongkan jika nihil)</label>
                                        <input type="text" x-model="form.guruTidakHadir" placeholder="Cth: Bpk. Budi (Sakit), Ibu Ani (Izin)" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
                                    </div>
                                </div>

                                <!-- Rekap Absensi Kelas -->
                                <div>
                                    <div class="flex items-center justify-between bg-gray-50 p-3 rounded-t-lg border border-gray-200 border-b-0">
                                        <label class="font-medium text-gray-800"><i class="fas fa-users mr-2 text-blue-600"></i>Rekapitulasi Absensi Siswa</label>
                                        <div class="text-xs text-gray-500 font-medium">S = Sakit, I = Izin, A = Alpa</div>
                                    </div>
                                    <div class="border border-gray-200 rounded-b-lg p-4 bg-white overflow-x-auto">
                                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                            <template x-for="kelas in classes" :key="kelas">
                                                <div class="border rounded p-2 bg-gray-50">
                                                    <div class="font-bold text-center text-blue-800 mb-2 border-b pb-1" x-text="'Kelas ' + kelas"></div>
                                                    <div class="flex justify-between space-x-1 text-sm">
                                                        <div class="flex flex-col items-center">
                                                            <span class="text-xs font-semibold text-gray-500 mb-1">S</span>
                                                            <input type="number" min="0" x-model="form.absensi[kelas].s" class="w-10 p-1 text-center border rounded">
                                                        </div>
                                                        <div class="flex flex-col items-center">
                                                            <span class="text-xs font-semibold text-gray-500 mb-1">I</span>
                                                            <input type="number" min="0" x-model="form.absensi[kelas].i" class="w-10 p-1 text-center border rounded">
                                                        </div>
                                                        <div class="flex flex-col items-center">
                                                            <span class="text-xs font-semibold text-gray-500 mb-1">A</span>
                                                            <input type="number" min="0" x-model="form.absensi[kelas].a" class="w-10 p-1 text-center border rounded">
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <!-- Kejadian Penting -->
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Kejadian Penting / Catatan Selama Piket</label>
                                    <textarea x-model="form.kejadianPenting" rows="3" placeholder="Tuliskan kejadian penting atau pelanggaran tata tertib hari ini..." class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:border-blue-500"></textarea>
                                </div>

                                <!-- Upload Foto -->
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Upload Foto Dokumentasi Piket</label>
                                    <div class="flex items-center justify-center w-full">
                                        <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-48 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 relative overflow-hidden">
                                            <div class="flex flex-col items-center justify-center pt-5 pb-6" x-show="!form.fotoBase64">
                                                <i class="fas fa-camera text-4xl text-gray-400 mb-3"></i>
                                                <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Klik untuk ambil foto</span> atau pilih file</p>
                                                <p class="text-xs text-gray-500">Kamera HP didukung (Otomatis Kompresi)</p>
                                            </div>
                                            <template x-if="form.fotoBase64">
                                                <img :src="form.fotoBase64" class="absolute inset-0 w-full h-full object-contain bg-black bg-opacity-10" />
                                            </template>
                                            <input id="dropzone-file" type="file" accept="image/*" capture="environment" class="hidden" @change="handleImageUpload" />
                                        </label>
                                    </div>
                                    <p class="text-xs text-red-500 mt-1" x-show="form.fotoBase64">Foto telah dipilih. Klik area foto untuk mengubah.</p>
                                </div>

                                <div class="pt-4 border-t">
                                    <button type="submit" class="w-full md:w-auto px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow transition">
                                        <i class="fas fa-paper-plane mr-2"></i> Kirim Laporan Piket
                                    </button>
                                </div>
                            </form>
                        </div>

                        <!-- Riwayat Guru -->
                        <div x-show="guruTab === 'riwayat'" class="bg-white rounded-xl shadow p-6 overflow-hidden" style="display: none;">
                            <h3 class="text-lg font-bold text-gray-800 mb-4">Riwayat Laporan Piket Saya</h3>
                            
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tanggal</th>
                                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Kehadiran</th>
                                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Absen Siswa</th>
                                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Foto</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-200 text-sm">
                                        <template x-for="item in riwayatGuru" :key="item.id">
                                            <tr class="hover:bg-gray-50">
                                                <td class="px-4 py-3 whitespace-nowrap text-gray-900 font-medium" x-text="item.tanggal"></td>
                                                <td class="px-4 py-3 whitespace-nowrap text-gray-600">
                                                    Piket: <span x-text="item.jamHadir"></span><br>
                                                    Tdk Hadir: <span x-text="item.guruTidakHadir || '-'"></span>
                                                </td>
                                                <td class="px-4 py-3 text-gray-600 text-xs">
                                                    <button @click="viewRekap(item.rekapAbsen)" class="text-blue-600 hover:underline"><i class="fas fa-eye"></i> Lihat Rekap</button>
                                                </td>
                                                <td class="px-4 py-3 whitespace-nowrap text-center">
                                                    <button @click="printReport(item, 'form')" class="inline-block px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium hover:bg-green-200 mr-1" title="Cetak Form"><i class="fas fa-print"></i> Form</button>
                                                    <button @click="printReport(item, 'table')" class="inline-block px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs font-medium hover:bg-yellow-200 mr-1" title="Cetak Tabel"><i class="fas fa-table"></i> Tabel</button>
                                                    <template x-if="item.fotoUrl && item.fotoUrl !== '-'">
                                                        <a :href="item.fotoUrl" target="_blank" class="inline-block px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-medium hover:bg-blue-200">Lihat Foto</a>
                                                    </template>
                                                    <template x-if="!item.fotoUrl || item.fotoUrl === '-'">
                                                        <span class="text-gray-400 text-xs">-</span>
                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                        <tr x-show="riwayatGuru.length === 0">
                                            <td colspan="4" class="px-4 py-8 text-center text-gray-500">Belum ada riwayat laporan.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- KONTEN ADMIN -->
                <template x-if="user && user.role === 'admin'">
                    <div class="flex-grow max-w-7xl mx-auto w-full p-4 space-y-6">
                        
                        <!-- Dashboard Cards -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            <div class="bg-white p-5 rounded-xl shadow border-l-4 border-blue-500 flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-500 font-medium">Total Laporan Masuk</p>
                                    <h3 class="text-2xl font-bold text-gray-800" x-text="laporan.length"></h3>
                                </div>
                                <div class="bg-blue-100 p-3 rounded-full text-blue-600"><i class="fas fa-file-lines text-xl"></i></div>
                            </div>
                            <div class="bg-white p-5 rounded-xl shadow border-l-4 border-green-500 flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-500 font-medium">Total Akun Guru</p>
                                    <h3 class="text-2xl font-bold text-gray-800" x-text="usersData.length"></h3>
                                </div>
                                <div class="bg-green-100 p-3 rounded-full text-green-600"><i class="fas fa-users text-xl"></i></div>
                            </div>
                            <button @click="loadDataAdmin(true)" class="bg-white p-5 rounded-xl shadow flex items-center justify-center gap-2 text-blue-600 hover:bg-gray-50 transition cursor-pointer border border-transparent hover:border-blue-200">
                                <i class="fas fa-sync-alt"></i> <span class="font-bold">Refresh Data</span>
                            </button>
                        </div>

                        <!-- Tabs Admin -->
                        <div class="flex space-x-2 bg-white rounded-lg p-1 shadow max-w-xl flex-wrap gap-y-2">
                            <button @click="adminTab = 'laporan'" :class="adminTab === 'laporan' ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-100'" class="flex-1 py-2 px-4 rounded-md font-medium text-sm transition whitespace-nowrap">
                                <i class="fas fa-table mr-2"></i> Data Laporan
                            </button>
                            <button @click="adminTab = 'users'" :class="adminTab === 'users' ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-100'" class="flex-1 py-2 px-4 rounded-md font-medium text-sm transition whitespace-nowrap">
                                <i class="fas fa-users-cog mr-2"></i> Kelola Guru
                            </button>
                            <button @click="loadSiswaData()" :class="adminTab === 'siswa' ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-100'" class="flex-1 py-2 px-4 rounded-md font-medium text-sm transition whitespace-nowrap">
                                <i class="fas fa-file-excel mr-2"></i> Format Absen
                            </button>
                        </div>

                        <!-- TAB LAPORAN -->
                        <div x-show="adminTab === 'laporan'" class="bg-white rounded-xl shadow overflow-hidden">
                            <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                                <h3 class="font-bold text-gray-800">Semua Data Laporan Piket</h3>
                            </div>
                            <div class="overflow-x-auto p-4">
                                <table class="min-w-full divide-y divide-gray-200 border">
                                    <thead class="bg-gray-100">
                                        <tr>
                                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase">Tgl / Waktu</th>
                                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase">Nama Piket</th>
                                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase">Keterangan</th>
                                            <th class="px-4 py-3 text-center text-xs font-bold text-gray-600 uppercase">Absen Siswa</th>
                                            <th class="px-4 py-3 text-center text-xs font-bold text-gray-600 uppercase">Foto</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-200 text-sm">
                                        <template x-for="lap in laporan" :key="lap.id">
                                            <tr class="hover:bg-blue-50">
                                                <td class="px-4 py-3 whitespace-nowrap">
                                                    <div class="font-medium text-gray-900" x-text="lap.tanggal"></div>
                                                    <div class="text-xs text-gray-500">Hadir: <span x-text="lap.jamHadir"></span></div>
                                                </td>
                                                <td class="px-4 py-3 font-medium text-blue-700" x-text="lap.namaGuru"></td>
                                                <td class="px-4 py-3 max-w-xs">
                                                    <div class="text-xs truncate"><span class="font-semibold">Tdk Hadir:</span> <span x-text="lap.guruTidakHadir || '-'"></span></div>
                                                    <div class="text-xs truncate"><span class="font-semibold">Kejadian:</span> <span x-text="lap.kejadianPenting || '-'"></span></div>
                                                </td>
                                                <td class="px-4 py-3 text-center">
                                                    <button @click="printReport(lap, 'form')" class="inline-flex items-center justify-center w-8 h-8 bg-green-100 text-green-600 rounded hover:bg-green-200 mr-1" title="Cetak Form">
                                                        <i class="fas fa-print"></i>
                                                    </button>
                                                    <button @click="printReport(lap, 'table')" class="inline-flex items-center justify-center w-8 h-8 bg-yellow-100 text-yellow-600 rounded hover:bg-yellow-200 mr-1" title="Cetak Tabel">
                                                        <i class="fas fa-table"></i>
                                                    </button>
                                                     <template x-if="lap.fotoUrl && lap.fotoUrl !== '-'">
                                                        <a :href="lap.fotoUrl" target="_blank" class="inline-flex items-center justify-center w-8 h-8 bg-blue-100 text-blue-600 rounded hover:bg-blue-200" title="Lihat Foto">
                                                            <i class="fas fa-image"></i>
                                                        </a>
                                                    </template>
                                                    <template x-if="!lap.fotoUrl || lap.fotoUrl === '-'">
                                                        <span class="text-gray-300"><i class="fas fa-image"></i></span>
                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                        <tr x-show="laporan.length === 0">
                                            <td colspan="5" class="px-4 py-8 text-center text-gray-500">Belum ada data laporan.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- TAB MANAJEMEN USER -->
                        <div x-show="adminTab === 'users'" class="bg-white rounded-xl shadow overflow-hidden" style="display: none;">
                            <div class="p-4 bg-gray-50 border-b flex justify-between items-center flex-wrap gap-2">
                                <h3 class="font-bold text-gray-800">Kelola Akun Guru Piket</h3>
                                <button @click="modalUser = true" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-green-700">
                                    <i class="fas fa-plus mr-1"></i> Tambah Guru
                                </button>
                            </div>

                // --- KOMPRESI & UPLOAD IMAGE ---
                handleImageUpload(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    if (file.size > 5 * 1024 * 1024) { // Max 5MB sebelum kompresi
                        this.showToast('Ukuran file terlalu besar! Maks 5MB', 'error');
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            // Kompresi Canvas
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 800;
                            const MAX_HEIGHT = 800;
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                            } else {
                                if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            // Convert to JPEG base64 (70% quality)
                            this.form.fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        }
                        img.src = event.target.result;
                    }
                    reader.readAsDataURL(file);
                },

                        this.showToast('Teks data masih kosong!', 'error');
                        return;
                    }
                    const rows = this.importText.split('\n');
                    let count = 0;
                    
                    rows.forEach(row => {
                        if(row.trim() === '') return;
                        
                        const cols = row.split('\t'); // Excel memisahkan antarkolom menggunakan Tab
                        let nis = '', lp = 'L', nama = '';

                        if (cols.length >= 3) {
                            nis = cols[0].trim();
                            lp = cols[1].trim().toUpperCase() === 'P' ? 'P' : 'L';
                            nama = cols[2].trim();
                        } else if (cols.length === 2) {
                            nis = cols[0].trim();
                            nama = cols[1].trim();
                        } else if (cols.length === 1) {
                            nama = cols[0].trim();
                        }
                        
                        if(nama || nis) {
                            this.listSiswa.push({ nis: nis, lp: lp, nama: nama });
                            count++;
                        }
                    });
                    
                    this.importText = '';
                    this.modalImport = false;
                    this.showToast(`${count} data siswa berhasil ditambahkan! Jangan lupa klik Simpan.`);

                },

                // --- CORE FETCH KE GAS ---
                async fetchGAS(payload) {
                    // Bypass CORS di Blogger: Gunakan method POST dengan Content-Type default text/plain
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    return result;
                }
